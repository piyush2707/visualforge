<text x="72" y="205" fill="#a8b7ff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">THE VISUAL ASSET WORKFLOW</text><text x="68" y="290" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-3">VisualForge</text><text x="74" y="342" fill="#c6cbe2" font-family="Inter,Arial,sans-serif" font-size="24">Create. Validate. Integrate.</text><text x="74" y="385" fill="#c6cbe2" font-family="Inter,Arial,sans-serif" font-size="20">For Claude Code + Codex</text><rect x="74" y="435" width="220" height="44" rx="22" fill="#25294b" stroke="#7376e9"/><text x="96" y="463" fill="#e8eaff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">NO SURPRISE API COSTS</text><text x="74" y="560" fill="#7d87ac" font-family="Inter,Arial,sans-serif" font-size="14">Capability-aware • Local-first • Honest by design</text>
